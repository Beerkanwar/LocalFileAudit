name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (Windows / .NET 9)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@395042844436875d69eac7840a6428c51084bc49 # v4.2.0
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore LocalFileAudit.slnx

    - name: Vulnerability audit
      shell: pwsh
      run: |
        $vuln = dotnet list package --vulnerable --include-transitive
        $vuln | Out-String | Write-Host
        if ($vuln -match 'has the following vulnerable packages') {
          throw "Vulnerable NuGet packages detected in solution!"
        }

    - name: Build solution
      run: dotnet build LocalFileAudit.slnx --configuration Release --no-restore

    - name: Run automated tests
      run: dotnet test LocalFileAudit.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

    - name: Publish test results
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: always()
      with:
        name: test-results
        path: "**/test_results.trx"
        if-no-files-found: ignore
