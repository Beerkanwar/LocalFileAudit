name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (Windows / .NET 9)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore LocalFileAudit.slnx

    - name: Vulnerability audit
      shell: pwsh
      run: |
        $vuln = dotnet list package --vulnerable --include-transitive
        $vuln | Out-String | Write-Host
        if ($LASTEXITCODE -ne 0) {
          throw "dotnet list package failed with exit code $LASTEXITCODE (feed may be unreachable or error occurred)"
        }
        if ($vuln -match 'has the following vulnerable packages') {
          throw "Vulnerable NuGet packages detected in solution!"
        }

    - name: Build solution
      run: dotnet build LocalFileAudit.slnx --configuration Release --no-restore

    - name: Run automated tests
      run: dotnet test LocalFileAudit.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

    - name: Publish test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/test_results.trx"
        if-no-files-found: ignore
