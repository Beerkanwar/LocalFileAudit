name: Release Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (win-x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Run automated test suite
      run: dotnet test LocalFileAudit.slnx --configuration Release --verbosity normal

    - name: Publish Self-Contained Binary (win-x64)
      run: |
        dotnet publish LocalFileAudit.App/LocalFileAudit.App.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          --output ./publish-release/

    - name: Package Release ZIP (excluding PDBs)
      shell: pwsh
      run: |
        # Ensure no PDBs exist
        Get-ChildItem -Path ./publish-release -Filter *.pdb -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

        # Create zip archive
        Compress-Archive -Path ./publish-release/* -DestinationPath ./LocalFileAudit-win-x64.zip -Force

        # Generate SHA256 checksum
        $hash = (Get-FileHash -Algorithm SHA256 ./LocalFileAudit-win-x64.zip).Hash
        "$hash  LocalFileAudit-win-x64.zip" | Out-File -FilePath ./LocalFileAudit-win-x64.zip.sha256 -Encoding ascii

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          LocalFileAudit-win-x64.zip
          LocalFileAudit-win-x64.zip.sha256
        draft: false
        prerelease: false
        body: |
          ## LocalFileAudit ${{ github.ref_name }} 🔍

          ### Highlights
          - **100% Read-Only Safety:** Zero file modifications, deletions, or moves.
          - **Offline & Private:** All inventory scanning and deterministic metrics run entirely locally.
          - **Self-Contained Executable:** Standalone 64-bit Windows binary (.NET runtime embedded; no prerequisites required).
          - **Crash-Safe Persistence:** SQLite Write-Ahead Logging (WAL) engine.
          - **Two-Stage Duplicates:** Exact-size clustering with asynchronous SHA-256 cryptographic verification.
          - **Atomic Reports:** Multi-format exports (Markdown, HTML, CSVs, Manifest).
          - **Optional Local AI Review:** Connect to local Ollama (`http://127.0.0.1:11434`) for narrative analysis.

          ---

          ### ⚠️ Notice on Windows SmartScreen & Antivirus Warnings
          Because LocalFileAudit is an open-source utility published without a paid commercial Extended Validation (EV) code-signing certificate, Windows SmartScreen may display a warning:
          > *"Windows protected your PC — Microsoft Defender SmartScreen prevented an unrecognized app from starting."*

          To launch the application:
          1. Click **More info**.
          2. Click **Run anyway**.

          You can independently verify the binary integrity using the provided `LocalFileAudit-win-x64.zip.sha256` checksum.
