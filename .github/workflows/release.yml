name: Release Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (win-x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Verify tag matches Directory.Build.props version
      shell: pwsh
      run: |
        [xml]$props = Get-Content Directory.Build.props
        $v = $props.Project.PropertyGroup.Version | Select-Object -First 1
        $tag = '${{ github.ref_name }}'.TrimStart('v')
        if ($v -ne $tag) { throw "Tag '${{ github.ref_name }}' does not match Directory.Build.props version '$v'" }

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@395042844436875d69eac7840a6428c51084bc49 # v4.2.0
      with:
        dotnet-version: '9.0.x'

    - name: Vulnerability audit
      shell: pwsh
      run: |
        $vuln = dotnet list package --vulnerable --include-transitive
        $vuln | Out-String | Write-Host
        if ($vuln -match 'has the following vulnerable packages') {
          throw "Vulnerable NuGet packages detected in solution!"
        }

    - name: Run automated test suite
      run: dotnet test LocalFileAudit.slnx --configuration Release --verbosity normal

    - name: Publish Self-Contained Binaries (win-x64 and win-arm64)
      run: |
        dotnet publish LocalFileAudit.App/LocalFileAudit.App.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          --output ./publish-release-x64/

        dotnet publish LocalFileAudit.App/LocalFileAudit.App.csproj `
          --configuration Release `
          --runtime win-arm64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          --output ./publish-release-arm64/

    - name: Package Release ZIPs (excluding PDBs)
      shell: pwsh
      run: |
        foreach ($target in @('x64', 'arm64')) {
          $pubDir = "./publish-release-$target"
          Get-ChildItem -Path $pubDir -Filter *.pdb -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          $zipName = "LocalFileAudit-${{ github.ref_name }}-win-$target.zip"
          Compress-Archive -Path $pubDir/* -DestinationPath ./$zipName -Force

          $hash = (Get-FileHash -Algorithm SHA256 ./$zipName).Hash
          "$hash  $zipName" | Out-File -FilePath ./$zipName.sha256 -Encoding ascii
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@c95fe148935b9c7a1815966172d2037ed86b0e92 # v2.2.1
      with:
        files: |
          LocalFileAudit-${{ github.ref_name }}-win-x64.zip
          LocalFileAudit-${{ github.ref_name }}-win-x64.zip.sha256
          LocalFileAudit-${{ github.ref_name }}-win-arm64.zip
          LocalFileAudit-${{ github.ref_name }}-win-arm64.zip.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## LocalFileAudit ${{ github.ref_name }} 🔍

          ### Quick Start
          Extract the full zip archive, then run `LocalFileAudit.App.exe` (.NET runtime is embedded; no separate installation required).

          ### Core Guarantees
          - **100% Read-Only Safety:** Zero file modifications, deletions, or moves.
          - **Offline & Private:** All inventory scanning, metrics, and hashing run entirely on your local machine.
          - **Crash-Safe Persistence:** SQLite Write-Ahead Logging (WAL) engine.
          - **Archive Verification & Planning:** Read-only comparison with SHA-256 and reviewable PowerShell script generation.
          - **Run Comparison:** Historical scan diffing to track new, deleted, and modified files.
          - **Optional Local AI Review:** Local Ollama integration (`http://127.0.0.1:11434`) with follow-up chat support.
          - **Changelog:** Detailed version history in [CHANGELOG.md](https://github.com/Beerkanwar/LocalFileAudit/blob/main/CHANGELOG.md).

          ---

          ### ⚠️ Notice on Windows SmartScreen & Antivirus Warnings
          Because LocalFileAudit is an open-source utility published without a paid commercial Extended Validation (EV) code-signing certificate, Windows SmartScreen may display a warning:
          > *"Windows protected your PC — Microsoft Defender SmartScreen prevented an unrecognized app from starting."*

          To launch the application:
          1. Click **More info**.
          2. Click **Run anyway**.

          You can independently verify binary integrity using the provided `.sha256` checksum file.
